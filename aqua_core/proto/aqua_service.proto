syntax = "proto3";

package aqua.pb;

// Aqua 控制面协议（信令控制；UDP 只负责传输与 NAT 维持）。
// 存活分层：session/控制面存活由 proto Keepalive RPC 判定（应用层行为，
// 传输层 channel 参数保持默认）；UDP heartbeat 只做 association 建立与
// NAT/endpoint 续命，不碰 last_seen。
// gRPC 负责 session 生命周期管理与音频契约下发，不参与媒体传输。
service AudioService {
  // 创建 session，返回 session_id + UDP endpoint + 当前 server 音频格式
  rpc Connect(ConnectRequest) returns(ConnectResponse);
  // 删除 session
  rpc Disconnect(DisconnectRequest) returns(Empty);
  // proto keepalive（应用层探活，不依赖 gRPC 内部 HTTP/2 ping 调参）：
  // client 周期调用，server 刷新 session 存活并返回会话有效性。
  // 传输失败 = 控制面死亡；session_valid=false = 会话已不在（被 reaper 清理等）。
  rpc Keepalive(KeepaliveRequest) returns(KeepaliveResponse);
}

message Empty {}

// ---- Connect ----

message ConnectRequest {
  string client_name = 1;
}

// Connect 响应：按"客户端所属地址族"分成两个数据面槽。
//
// 槽的三态（客户端只看自己那一族的槽）：
//   具体地址      字段存在，address 为具体字面量（族必须与槽一致），port 为实际端口
//   通配 sentinel 字段存在，address 为该族的通配值（0.0.0.0 / ::），port 为实际端口
//                 ⇒ 客户端改用"自己连接控制面时使用的地址"，族由构造保证一致
//   空槽          字段不存在（has_udp()/has_udp6() == false）
//                 ⇒ 本 server 不服务该族数据面，客户端必须硬失败
//
// 硬约束：udp 槽内地址必须是 IPv4（或 0.0.0.0），udp6 槽内地址必须是 IPv6（或 ::）。
// 禁止跨族（server 侧配置期即拒绝，永远不会下发跨族值）。
//
// 注意：字段号相对早期版本整体重排，不与旧版客户端兼容。
message ConnectResponse {
  // SessionManager 生成的 ID
  uint32 session_id = 1;
  // IPv4 客户端使用的数据面端点。字段不存在 ⇒ 不服务 IPv4 数据面。
  UdpEndpoint udp = 2;
  // IPv6 客户端使用的数据面端点。字段不存在 ⇒ 不服务 IPv6 数据面。
  UdpEndpoint udp6 = 3;
  // 当前 server 音频流 PCM 格式；server 在一次运行期内固定，来自显式配置或 capture backend 默认格式
  AudioFormat audio_format = 4;
  // 每个 AudioFrame 的 sample frame 数（server 运行期固定打包大小，session 内不变）。
  // client 据此预分配 JitterBuffer；0 表示未设置（client 应拒绝）。
  uint32 frame_count = 5;
}

// ---- Disconnect ----

message DisconnectRequest {
  uint32 session_id = 1;
}

// ---- Keepalive（proto 应用层探活）----

message KeepaliveRequest {
  uint32 session_id = 1;
}

message KeepaliveResponse {
  // session 是否仍然有效（false = 已被清理，client 应停止重建而非重试）。
  bool session_valid = 1;
}

// ---- 共用消息 ----

message UdpEndpoint {
  string address = 1;
  uint32 port = 2;
}

// PCM 音频格式描述（仅描述数据本身，不含 packet_size / latency 等传输层字段）
message AudioFormat {
  enum Encoding {
    ENCODING_INVALID = 0;
    ENCODING_PCM_S16LE = 1; // PCM Signed 16-bit Little Endian
    ENCODING_PCM_S32LE = 2; // PCM Signed 32-bit Little Endian
    ENCODING_PCM_F32LE = 3; // PCM Float 32-bit Little Endian
    ENCODING_PCM_S24LE = 4; // PCM Signed 24-bit Little Endian
    ENCODING_PCM_U8 = 5; // PCM Unsigned 8-bit
  }

  Encoding encoding = 1;   // 编码格式（强制小端序）
  uint32 channels = 2;     // 声道数 (1=单声道, 2=立体声)
  uint32 sample_rate = 3;  // 采样率 (Hz, 如 44100/48000)
}
